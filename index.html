<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="4lpha" />
    <link rel="icon" type="image/png" href="/gin-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="4lpha" />
    <title>4lpha</title>
    <script>
      // Gespeichertes Theme vor dem ersten Paint setzen (Gegenstück: index.css, AppShell)
      try {
        var s = JSON.parse(localStorage.getItem("4lpha"));
        var t = s.theme;
        if (t === "accent" || t === "light")
          document.documentElement.dataset.theme = t;
        if (t === "accent" && /^(orange|pink|purple|sky)$/.test(s.accent))
          document.documentElement.dataset.accent = s.accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
